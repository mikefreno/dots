# Fail2ban filter: repeated 401/403 on the internet-facing nginx.
# Catches brute-force attempts against basic-auth (macro.freno.me) and the
# app login pages proxied through nginx (pihole/kuma/ntfy/vaultwarden/...).
#
# Matches the standard nginx "combined" access.log format.
# Note: scanner noise mostly earns 301/404s, which do NOT match — only
# actual auth rejections count.
[Definition]
failregex = ^<HOST> - .* "(?:GET|POST|HEAD|PUT|DELETE|PATCH|OPTIONS|PROPFIND) [^"]*" (401|403) .*$
ignoreregex =
