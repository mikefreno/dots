# Jail: ban IPs that repeatedly fail auth on the public nginx.
# Protects the login surfaces: pihole/kuma/ntfy/vw/macro/... freno.me
# Install: cp to /etc/fail2ban/filter.d + /etc/fail2ban/jail.d, restart fail2ban.
[nginx-auth]
enabled = true
filter = nginx-auth
logpath = /var/log/nginx/access.log
maxretry = 5
findtime = 10m
bantime = 1h
# LAN mistakes shouldn't lock out local devices; remote IPs are bannable.
# 185.244.215.12 = Mike's VPN exit IP (Mac + its gitea runner arrive from
# here when remote). Find yours with: curl -4 ifconfig.me
ignoreip = 127.0.0.1/8 ::1 192.168.50.0/24 185.244.215.12
port = http,https
